<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>URAN BRAWL: STABLE VERSION</title>
    <style>
        :root { --blue: #008cff; --green: #2ecc71; --gold: #ffd700; --purple: #a020f0; --cyan: #00f2ff; }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; color: #fff; }
        
        #lobby { 
            position: fixed; inset: 0; 
            background: radial-gradient(circle at center, #004488 0%, #001122 100%);
            display: flex; flex-direction: column; z-index: 1; 
        }

        .top-bar { display: flex; justify-content: space-between; padding: 10px 20px; background: rgba(0,0,0,0.6); border-bottom: 2px solid var(--cyan); }
        .res { font-size: 18px; display: flex; gap: 15px; font-weight: bold; }

        .preview { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #rank-badge { background: var(--gold); color: #000; padding: 5px 15px; border-radius: 10px; font-weight: bold; margin-bottom: 10px; }
        
        #tank-view { display: block; filter: drop-shadow(0 0 20px var(--cyan)); }

        .bottom-nav { display: flex; gap: 10px; justify-content: center; padding: 20px; background: rgba(0,0,0,0.8); }
        .btn { padding: 12px 20px; border-radius: 8px; border: 2px solid #fff; cursor: pointer; font-size: 14px; background: #111; color: #fff; font-weight: bold; }
        .play-btn { background: var(--green) !important; color: #000 !important; font-size: 24px; padding: 10px 60px; box-shadow: 0 0 20px var(--green); }

        .modal { position: fixed; inset: 5%; background: rgba(0,5,15,0.98); border: 2px solid var(--cyan); z-index: 100; display: none; flex-direction: column; align-items: center; padding: 20px; border-radius: 20px; }
        .scroll { overflow-y: auto; width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
        .card { background: #002244; padding: 15px; border: 1px solid var(--cyan); text-align: center; border-radius: 10px; }

        #game-canvas { display: none; position: fixed; inset: 0; z-index: 50; background: #050505; }
        #ui-game { position: fixed; top: 10px; left: 10px; z-index: 60; display: none; font-size: 22px; color: var(--cyan); background: rgba(0,0,0,0.5); padding: 10px; }
        #gadget-f { position: fixed; bottom: 30px; right: 30px; width: 85px; height: 85px; border-radius: 50%; background: var(--purple); border: 4px solid #fff; display: none; align-items: center; justify-content: center; font-size: 40px; z-index: 60; cursor: pointer; box-shadow: 0 0 15px var(--purple); }
    </style>
</head>
<body>

<div id="lobby">
    <div class="top-bar">
        <div class="res">
            <span style="color:var(--cyan)">🔑 <span id="chips-ui">0</span></span>
            <span style="color:var(--purple)">µ <span id="micro-ui">0</span></span>
            <span style="color:var(--gold)">🏆 <span id="cups-ui">0</span></span>
        </div>
        <div>
            <button class="btn" onclick="openM('pass-m')">URAN PASS</button>
            <button class="btn" onclick="openM('promo-m')">ПРОМОКОД</button>
        </div>
    </div>

    <div class="preview">
        <div id="rank-badge">РАНГ 1</div>
        <canvas id="tank-view" width="500" height="300"></canvas>
        <h1 id="name-ui" style="margin:10px 0;">T-34</h1>
        <button class="btn" style="border-color:var(--cyan)" onclick="openM('skin-m')">👗 ЗМІНИТИ СКІН</button>
    </div>

    <div class="bottom-nav">
        <button class="btn" onclick="openM('hangar-m')">АНГАР</button>
        <button class="btn play-btn" onclick="startGame()">В БІЙ!</button>
        <button class="btn" onclick="openM('shop-m')">МАГАЗИН</button>
    </div>
</div>

<div id="hangar-m" class="modal"><h2>АНГАР</h2><div class="scroll" id="h-list"></div><button class="btn" style="margin-top:20px" onclick="closeM('hangar-m')">ЗАКРИТИ</button></div>
<div id="pass-m" class="modal"><h2>URAN PASS</h2><div class="scroll" id="pass-list"></div><button class="btn" style="margin-top:20px" onclick="closeM('pass-m')">ЗАКРИТИ</button></div>

<div id="shop-m" class="modal">
    <h2>МАГАЗИН</h2>
    <div class="scroll">
        <div class="card"><h3>КЕЙС</h3><p>100 🔑</p><button class="btn" onclick="buyCase()">ВІДКРИТИ</button></div>
        <div class="card"><h3>GOLD СКІН</h3><p>1000 🔑</p><button class="btn" onclick="buyDirectSkin('GOLD', '#ffd700')">КУПИТИ</button></div>
        <div class="card"><h3>NIGHT СКІН</h3><p>1000 🔑</p><button class="btn" onclick="buyDirectSkin('NIGHT', '#1a1a1a')">КУПИТИ</button></div>
    </div>
    <button class="btn" style="margin-top:20px" onclick="closeM('shop-m')">ЗАКРИТИ</button>
</div>

<div id="skin-m" class="modal"><h2>ВИБІР СКІНА</h2><div class="scroll" id="s-list"></div><button class="btn" style="margin-top:20px" onclick="closeM('skin-m')">ЗАКРИТИ</button></div>
<div id="promo-m" class="modal"><h2>ПРОМОКОД</h2><input type="text" id="promo-in" style="font-size:30px; text-align:center;"><button class="btn" style="margin-top:10px" onclick="usePromo()">ВВЕСТИ</button><button class="btn" onclick="closeM('promo-m')">НАЗАД</button></div>

<canvas id="game-canvas"></canvas>
<div id="ui-game">HP: <span id="hp-val">0</span> | ЗАЛИШИЛОСЬ: <span id="en-val">0</span></div>
<div id="gadget-f" onclick="useGadget()">F</div>

<script>
// ТВІЙ СПИСОК ТАНКІВ
const allTanks = [
    {id:0, n:"T-34", c:"#4caf50", hp:800, d:180, p:0, g:"Heal"},
    {id:1, n:"PANZER", c:"#9e9e9e", hp:1200, d:220, p:0, g:"Shield"},
    {id:2, n:"TIGER", c:"#d4a017", hp:1800, d:350, p:500, g:"Burst"},
    {id:3, n:"MAUS", c:"#424242", hp:6000, d:500, p:2000, g:"Shield"},
    {id:4, n:"LEOPARD", c:"#bcbcbc", hp:1400, d:280, p:800, g:"Speed"},
    {id:5, n:"IS-7", c:"#2e4d23", hp:3000, d:450, p:1500, g:"Heal"},
    {id:6, n:"M1 ABRAMS", c:"#c2b280", hp:2200, d:400, p:1200, g:"Burst"},
    {id:7, n:"T-90", c:"#4b5320", hp:2500, d:500, p:1800, g:"Burst"},
    {id:8, n:"CHALLENGER", c:"#556b2f", hp:3200, d:450, p:2200, g:"Shield"},
    {id:9, n:"K-2 BLACK", c:"#111", hp:3500, d:650, p:3000, g:"Burst"},
    {id:10, n:"URAN-GIANT", c:"#fff", hp:15000, d:3000, p:7000, g:"God"}
];

// ВИКОРИСТОВУЄМО ТВІЙ КЛЮЧ ЗБЕРЕЖЕННЯ
let p = JSON.parse(localStorage.getItem('URAN_FINAL_STABLE')) || {
    chips: 500, micro: 0, cups: 0, owned: [0, 1], skins: [], sel: 0, selSkin: 'none', promos: []
};

function save() {
    localStorage.setItem('URAN_FINAL_STABLE', JSON.stringify(p));
    document.getElementById('chips-ui').innerText = Math.floor(p.chips);
    document.getElementById('micro-ui').innerText = Math.floor(p.micro);
    document.getElementById('cups-ui').innerText = Math.floor(p.cups);
    document.getElementById('name-ui').innerText = allTanks.find(t=>t.id===p.sel).n;
    document.getElementById('rank-badge').innerText = "РАНГ " + (Math.floor(p.cups/500) + 1);
}

function openM(id) {
    document.querySelectorAll('.modal').forEach(m=>m.style.display='none');
    document.getElementById(id).style.display='flex';
    if(id==='hangar-m') renderHangar();
    if(id==='skin-m') renderSkins();
    if(id==='pass-m') renderPass();
}
function closeM(id) { document.getElementById(id).style.display='none'; }

function renderHangar() {
    let h = document.getElementById('h-list'); h.innerHTML = '';
    allTanks.forEach(t => {
        let has = p.owned.includes(t.id);
        h.innerHTML += `<div class="card"><b>${t.n}</b><br><button class="btn" onclick="buyT(${t.id})">${has?'ОБРАТИ':t.p+' 🔑'}</button></div>`;
    });
}
function buyT(id) {
    let t = allTanks.find(x=>x.id===id);
    if(p.owned.includes(id)) { p.sel = id; p.selSkin = 'none'; save(); closeM('hangar-m'); }
    else if(p.chips >= t.p) { p.chips -= t.p; p.owned.push(id); save(); renderHangar(); }
}

function renderSkins() {
    let s = document.getElementById('s-list'); s.innerHTML = '<div class="card"><b>БЕЗ СКІНА</b><br><button class="btn" onclick="p.selSkin=\'none\';save();closeM(\'skin-m\')">ОБРАТИ</button></div>';
    p.skins.forEach(sk => { s.innerHTML += `<div class="card"><b>${sk.name}</b><br><button class="btn" onclick="p.selSkin='${sk.color}';save();closeM('skin-m')">ОБРАТИ</button></div>`; });
}

function renderPass() {
    let pl = document.getElementById('pass-list'); pl.innerHTML = '';
    for(let i=1; i<=10; i++) {
        let req = i * 500; let done = p.cups >= req;
        pl.innerHTML += `<div class="card"><h3>${req} 🏆</h3><button class="btn" ${done?'':'disabled'} onclick="p.chips+=1000;save();alert('Нагорода 1000 Ключів!')">${done?'ЗАБРАТИ':'ЗАКРИТО'}</button></div>`;
    }
}

function buyCase() {
    if(p.chips >= 100) {
        p.chips -= 100;
        if(Math.random() > 0.8) {
            let col = '#' + Math.floor(Math.random()*16777215).toString(16);
            p.skins.push({name: "Скін #"+(p.skins.length+1), color: col});
            alert("НОВИЙ СКІН ВИПАВ!");
        } else { p.micro += 250; alert("+250 МІКРО!"); }
        save();
    }
}

function buyDirectSkin(name, color) {
    if(p.chips >= 1000) { p.chips -= 1000; p.skins.push({name, color}); save(); alert("СКІН КУПЛЕНО!"); }
}

function usePromo() {
    let code = document.getElementById('promo-in').value.toUpperCase();
    if(p.promos.includes(code)) return alert("Вже використано!");
    if(code === 'URAN') { p.chips += 5000; p.promos.push(code); save(); closeM('promo-m'); }
}

function drawTank(c, x, y, bA, tA, tank, isEnemy, showShield) {
    c.save(); c.translate(x, y); 
    if(showShield) { c.strokeStyle="#00f2ff"; c.lineWidth=6; c.beginPath(); c.arc(0,0,65,0,7); c.stroke(); }
    c.rotate(bA);
    c.fillStyle="#111"; c.fillRect(-45,-40,90,18); c.fillRect(-45,22,90,18);
    c.fillStyle = isEnemy ? "#700" : (p.selSkin === 'none' ? tank.c : p.selSkin);
    c.fillRect(-40,-30,80,60);
    c.rotate(tA - bA); c.fillStyle="#333"; c.fillRect(-22,-22,44,44);
    c.fillStyle="#000"; c.fillRect(0,-6,70,12); c.restore();
}

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
let g = { active: false, px:0, py:0, pa:0, ta:0, hp:0, keys:{}, enemies:[], bullets:[], eb:[], gt:0, shield:false };

function startGame() {
    g.active = true; document.getElementById('lobby').style.display='none';
    canvas.style.display='block'; document.getElementById('ui-game').style.display='block';
    document.getElementById('gadget-f').style.display='flex';
    canvas.width=window.innerWidth; canvas.height=window.innerHeight;
    let t = allTanks.find(x=>x.id===p.sel); g.hp = t.hp; g.px=0; g.py=0; g.enemies=[]; g.bullets=[]; g.eb=[];
    for(let i=0; i<8; i++) g.enemies.push({x:Math.random()*3000-1500, y:Math.random()*3000-1500, hp:600, ls:0});
}

function useGadget() {
    if(Date.now() - g.gt < 12000) return;
    let t = allTanks.find(x=>x.id===p.sel);
    if(t.g === "Heal") g.hp += 1000;
    if(t.g === "Shield") { g.shield = true; setTimeout(()=>g.shield=false, 5000); }
    if(t.g === "God") { g.hp += 5000; g.shield = true; setTimeout(()=>g.shield=false, 8000); }
    g.gt = Date.now();
}

window.onmousedown = (e) => { 
    if(g.active) { 
        let t = allTanks.find(x=>x.id===p.sel);
        g.bullets.push({x:g.px, y:g.py, vx:Math.cos(g.ta)*22, vy:Math.sin(g.ta)*22, d:t.d});
    } 
};

window.onkeydown = e => { g.keys[e.code.toLowerCase()] = true; if(e.code==='Escape') location.reload(); };
window.onkeyup = e => g.keys[e.code.toLowerCase()] = false;
window.onmousemove = e => g.ta = Math.atan2(e.clientY - window.innerHeight/2, e.clientX - window.innerWidth/2);

function loop() {
    if(g.active) {
        ctx.fillStyle="#050505"; ctx.fillRect(0,0,canvas.width,canvas.height);
        let cx = g.px-canvas.width/2, cy = g.py-canvas.height/2;
        let s = 6;
        if(g.keys['keyw']) { g.px+=Math.cos(g.pa)*s; g.py+=Math.sin(g.pa)*s; }
        if(g.keys['keys']) { g.px-=Math.cos(g.pa)*(s/2); g.py-=Math.sin(g.pa)*(s/2); }
        if(g.keys['keya']) g.pa-=0.06; if(g.keys['keyd']) g.pa+=0.06;
        
        document.getElementById('hp-val').innerText = Math.max(0, g.hp);
        document.getElementById('en-val').innerText = g.enemies.length;

        g.enemies.forEach(en => {
            let a = Math.atan2(g.py-en.y, g.px-en.x); en.x += Math.cos(a)*2; en.y += Math.sin(a)*2;
            if(Date.now()-en.ls > 2500) { g.eb.push({x:en.x, y:en.y, vx:Math.cos(a)*12, vy:Math.sin(a)*12}); en.ls = Date.now(); }
            drawTank(ctx, en.x-cx, en.y-cy, a, a, {c:"#700"}, true, false);
        });

        g.bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy; ctx.fillStyle="#00f2ff"; ctx.beginPath(); ctx.arc(b.x-cx, b.y-cy, 6, 0, 7); ctx.fill();
            g.enemies.forEach((en, ei) => { if(Math.hypot(b.x-en.x, b.y-en.y)<45) { en.hp -= b.d; g.bullets.splice(i,1); if(en.hp<=0) g.enemies.splice(ei,1); } });
        });

        g.eb.forEach((eb, i) => {
            eb.x += eb.vx; eb.y += eb.vy; ctx.fillStyle="red"; ctx.beginPath(); ctx.arc(eb.x-cx, eb.y-cy, 7, 0, 7); ctx.fill();
            if(Math.hypot(eb.x-g.px, eb.y-g.py)<40) { if(!g.shield) g.hp -= 150; g.eb.splice(i,1); }
        });

        drawTank(ctx, g.px-cx, g.py-cy, g.pa, g.ta, allTanks.find(t=>t.id===p.sel), false, g.shield);
        
        // ФІКС ВИХОДУ: тепер точно працює
        if(g.hp <= 0) { 
            g.active = false; 
            alert("ВАС ЗНИЩЕНО!"); 
            location.reload(); 
        }
        if(g.enemies.length === 0) { 
            g.active = false;
            p.cups += 20; p.chips += 150; save(); 
            alert("ПЕРЕМОГА!"); 
            location.reload(); 
        }
    } else {
        let v = document.getElementById('tank-view').getContext('2d');
        v.clearRect(0,0,500,300);
        drawTank(v, 250, 150, Date.now()*0.001, 0, allTanks.find(t=>t.id===p.sel), false, false);
    }
    requestAnimationFrame(loop);
}
save(); loop();
</script>
</body>
</html>
